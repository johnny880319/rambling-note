[project]
name = "rambling-notes"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.23.16",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "plotly>=6.1.0",
]

[dependency-groups]
dev = [
    "openai>=2.53.0",
    "ruff>=0.16.2",
]

[tool.marimo.display]
custom_css = ["styles/marimo.css"]

[tool.ruff.lint.per-file-ignores]
# marimo's generated notebook format: every cell function ends with a return,
# and a bare trailing expression is how a cell renders its output. Both are
# structural to the notebook, not defects.
"content/**/*.py" = ["PLR1711", "B018"]
